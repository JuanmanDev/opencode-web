version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 2
    directory: /
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'vue', 'vue-tsc', '@vue/*']
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) is not supported by vue-tsc / @nuxt/ui yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
  - package-ecosystem: github-actions
    cooldown:
      default-days: 2
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    cooldown:
      default-days: 2
    directories: [/]
    schedule:
      interval: weekly
    ignore:
      # Node majors are bumped by hand once they reach LTS
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix(docker)
